<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titán TV - Reproductor Web OnPlay</title>
    <!-- F7: mpegts.js vendoreado (1.8.2, pineado). Antes se cargaba de
         jsdelivr con @latest: cualquier release nuevo — o comprometido —
         entraba solo al abrir la página. Ahora no hay dependencia externa. -->
    <script src="vendor/mpegts.js"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --accent: #00d26a;
            --accent-blue: #0070f3;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar {
            width: 360px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent-blue); }
        
        .categories {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .categories::-webkit-scrollbar { height: 4px; }
        .categories::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .cat-btn {
            background: var(--bg-main);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }
        
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
        }
        .channel-item:hover { background: var(--bg-hover); }
        .channel-item.active {
            background: rgba(0, 112, 243, 0.2);
            border-left: 4px solid var(--accent-blue);
        }
        .channel-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .channel-num {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
            min-width: 28px;
        }
        .channel-title {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .channel-cat {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: var(--bg-main);
            padding: 2px 8px;
            border-radius: 12px;
        }
        
        /* Main Player */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }
        .player-header {
            padding: 12px 24px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }
        .current-ch-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--accent);
            background: rgba(0, 210, 106, 0.15);
            padding: 4px 10px;
            border-radius: 16px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            background: #000;
        }
        
        .loading-overlay {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 1.1rem;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<div class="sidebar">

        <input type="text" id="searchBox" class="search-box" placeholder="🔍 Buscar canal (ej: ESPN, TyC, Telefe)...">
    </div>
    
    <div class="categories" id="catBar">

        <button class="cat-btn" onclick="filterCategory('INFANTILES')">🧸 Infantiles</button>
        <button class="cat-btn" onclick="filterCategory('DOCUMENTALES')">🌍 Documentales</button>
    </div>
    
    <div class="channel-list" id="channelList">
        <!-- Generado dinámicamente -->
    </div>
</div>

<div class="main-area">

        <video id="videoElement" controls autoplay></video>
    </div>
</div>

    let currentCategory = 'TODOS';
    let player = null;
    let currentActiveNum = 15;

    function renderChannels(query = '') {
        const container = document.getElementById('channelList');
        container.innerHTML = '';
        const q = query.toLowerCase().trim();

        channels.forEach((ch, idx) => {
            const num = idx + 1;
            const title = ch.title || 'Canal ' + num;
            const group = ch.group || 'GENERAL';

            // Filtro por categoría
            if (currentCategory !== 'TODOS') {
                if (!group.toUpperCase().includes(currentCategory)) return;
            }

            // Filtro por texto
            if (q) {
                const matchNum = num.toString() === q;
                const matchTitle = title.toLowerCase().includes(q);
                const matchGroup = group.toLowerCase().includes(q);
                if (!matchNum && !matchTitle && !matchGroup) return;
            }

            const item = document.createElement('div');
            item.className = 'channel-item' + (num === currentActiveNum ? ' active' : '');
            item.onclick = () => playChannel(num, title, ch.url);

            // F9: se construye con DOM/textContent en vez de innerHTML.
            // La lista de canales se actualiza pegando datos externos (M3U):
            // un título con HTML inyectaría código al renderizar.
            const left = document.createElement('div');
            left.className = 'channel-left';
            const numEl = document.createElement('span');
            numEl.className = 'channel-num';
            numEl.textContent = num;
            const titleEl = document.createElement('span');
            titleEl.className = 'channel-title';
            titleEl.textContent = title;
            left.appendChild(numEl);
            left.appendChild(titleEl);
            const catEl = document.createElement('span');
            catEl.className = 'channel-cat';
            catEl.textContent = group.split(' ')[0];
            item.appendChild(left);
            item.appendChild(catEl);
            container.appendChild(item);
        });
    }

    function filterCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'TODOS' && btn.textContent.includes('Todos')));
        });
        renderChannels(document.getElementById('searchBox').value);
    }

    function playChannel(num, title, url) {
        currentActiveNum = num;
        document.getElementById('currentChName').textContent = `${num}. ${title}`;
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        renderChannels(document.getElementById('searchBox').value);

        const videoElement = document.getElementById('videoElement');
        const loader = document.getElementById('loadingOverlay');
        loader.style.display = 'flex';

        if (player) {
            player.pause();
            player.unload();
            player.detachMediaElement();
            player.destroy();
            player = null;
        }

        if (mpegts.getFeatureList().mseLivePlayback) {
            player = mpegts.createPlayer({
                type: 'mse',
                isLive: true,
                url: url
            }, {
                enableWorker: true,
                lazyLoad: false,
                liveBufferLatencyChasing: true,
                liveBufferLatencyMaxLatency: 3.0,
                liveBufferLatencyMinRemain: 0.8
            });

            player.attachMediaElement(videoElement);
            player.load();
            
            player.on(mpegts.Events.ERROR, (errType, errDetail) => {
                console.error("Error reproduciendo:", errType, errDetail);
                loader.style.display = 'none';
            });

            videoElement.onplaying = () => {
                loader.style.display = 'none';
            };

            player.play().catch(e => {
                console.log("Autoplay esperando interacción del usuario");
                loader.style.display = 'none';
            });
        } else {
            alert('Tu navegador no soporta MediaSource Extensions (MSE).');
            loader.style.display = 'none';
        }
    }

    document.getElementById('searchBox').addEventListener('input', (e) => {
        renderChannels(e.target.value);
    });

    // Iniciar automáticamente en ESPN Premium (Canal 15)
    window.addEventListener('DOMContentLoaded', () => {
        renderChannels();
        const espn = channels[14];
        if (espn) {
            playChannel(15, espn.title, espn.url);
        }
    });
</script>
